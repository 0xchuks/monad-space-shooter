kind = "web"
previewPath = "/"
title = "Space Shooter"
version = "1.0.0"
id = "artifacts/space-shooter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24826

[services.development]
run = "pnpm --filter @workspace/space-shooter run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/space-shooter", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/space-shooter", "run", "start"]

[services.production.run.env]
PORT = "24826"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "24826"
